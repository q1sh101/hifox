// generate_pref_dump.cfg - full Firefox pref dump
//
// about:config is blocked by hardening. this replaces it.
// runs at Firefox startup, AFTER all lockPrefs are applied.
// enumerates every pref with its current value and lock status.
//
// output: <profile>/generated_pref_dump.txt (atomically published on startup)
// usage:  restart Firefox -> verify refreshes the repo baseline -> git diff config/generated_pref_dump.<target>.txt
//
// why: Firefox updates silently introduce new prefs with new defaults.
// diff between old and new dump reveals exactly what changed.
// no about:config needed - full visibility from one file.


function _hifoxWriteAtomic(_file, _text) {
  var _fos = null;
  try {
    _fos = Components.classes["@mozilla.org/network/safe-file-output-stream;1"]
             .createInstance(Components.interfaces.nsIFileOutputStream);
    _fos.init(_file, 0x02 | 0x08 | 0x20, 0o644, 0);
    var _cos = Components.classes["@mozilla.org/intl/converter-output-stream;1"]
                 .createInstance(Components.interfaces.nsIConverterOutputStream);
    _cos.init(_fos, "UTF-8");
    _cos.writeString(_text);
    _cos.flush();
    _fos.QueryInterface(Components.interfaces.nsISafeOutputStream).finish();
  } catch (e) {
    try { if (_fos) _fos.close(); } catch (_) {}
    throw e;
  }
}

// dump must run AFTER user.js (canary) and the ui_seeded observer have applied,
// so we defer until browser-delayed-startup-finished (or quit-application as fallback).
// running synchronously at autoconfig load misses prefs that get set later in the session.
function _hifoxDoDump() {
  try {
    var _pb = Components.classes["@mozilla.org/preferences-service;1"]
               .getService(Components.interfaces.nsIPrefBranch);
    var _all = _pb.getChildList("", {});
    var _out = [];
    // per-session noise: timestamps, UUIDs, counters - zero informational value
    // keep: version numbers, feature flags, policy settings, security prefs
    var _skip = [
      // timestamps (per-session)
      "app.update.lastUpdateTime.",
      "browser.crashReports.cleanupCheck.lastDate",
      "browser.keys.openAddons.lastUsed",
      "browser.laterrun.bookkeeping.profileCreationTime",
      "browser.laterrun.bookkeeping.",
      "browser.region.update.updated",
      "browser.safebrowsing.provider.google5.lastupdatetime",
      "browser.safebrowsing.provider.google5.nextupdatetime",
      "browser.safebrowsing.provider.mozilla.lastupdatetime",
      "browser.safebrowsing.provider.mozilla.nextupdatetime",
      "browser.startup.lastColdStartupCheck",
      "browser.urlbar.lastUrlbarSearchSeconds",
      "captchadetection.lastSubmission",
      "datareporting.policy.dataSubmissionPolicyNotifiedTime",
      "extensions.getAddons.cache.lastUpdate",
      "idle.lastDailyNotification",
      "media.gmp-gmpopenh264.last",
      "media.gmp-widevinecdm.last",
      "storage.vacuum.last.",
      "media.gmp-manager.buildID",
      "media.gmp-manager.lastCheck",
      "media.gmp-manager.lastEmptyCheck",
      "places.database.lastMaintenance",
      "toolkit.startup.last_success",
      "termsofuse.acceptedDate",
      // UUIDs (per-profile random identifiers)
      "_autoconfig.profile",
      "app.normandy.user_id",
      "browser.contextual-services.contextId",
      "browser.bookmarks.addedImportButton",
      "browser.newtabpage.activity-stream.impressionId",
      "browser.newtabpage.pinned",
      "dom.push.userAgentID",
      "extensions.webextensions.uuids",
      "nimbus.profileId",
      "toolkit.profiles.storeID",
      // counters & volatile server-pushed data
      "browser.newtabpage.activity-stream.discoverystream.sections.interestPicker",
      "browser.newtabpage.trainhopAddon",
      "browser.search.serpMetricsRecordedCounter",
      "browser.search.totalSearches",
      "browser.urlbar.quickactions.timesShownOnboardingLabel",
      "extensions.quarantinedDomains.list",
      "extensions.ui.",
      "privacy.sanitize.pending",
      "services.settings.",
      "trailhead.firstrun.",
      // build/distro drift (auto-bumped on Firefox/package updates)
      "app.normandy.last_seen_buildid",
      "media.gmp-gmpopenh264.abi",
      "media.gmp-gmpopenh264.hashFunction",
      "media.gmp-gmpopenh264.hashValue",
      "media.gmp-gmpopenh264.version",
      "media.gmp-widevinecdm.abi",
      "media.gmp-widevinecdm.hashFunction",
      "media.gmp-widevinecdm.hashValue",
      "media.gmp-widevinecdm.version",
      "browser.migration.version",
      "browser.sessionstore.upgradeBackup.latestBuildID",
      "distribution.iniFile.exists.appversion",
      "extensions.installedDistroAddon.",
      "extensions.lastAppBuildId",
      "extensions.lastPlatformVersion",
      // UI state (user-action driven)
      "accessibility.typeaheadfind.flashBar",
      "browser.download.dir",
      "browser.download.lastDir",
      "browser.download.panel.shown",
      "browser.eme.ui.firstContentShown",
      "browser.ipProtection.everOpenedPanel",
      "devtools.everOpened",
      "devtools.responsive.",
      "devtools.toolbox.",
      "devtools.toolsidebar-",
      "media.videocontrols.picture-in-picture.video-toggle.has-used",
      "sidebar.new-sidebar.has-used",
      "sidebar.old-sidebar.has-used",
      "sidebar.verticalTabs.dragToPinPromo.dismissed",
      "findbar.highlightAll",
      "browser.engagement.",
      "browser.firefox-view.button-clicks",
      "browser.smartwindow.firstrun.hasCompleted",
      "browser.smartwindow.firstrun.modelChoice",
      "browser.smartwindow.memories.hasSeenMemories",
      "browser.smartwindow.showThemesNotice",
      "browser.startup.couldRestoreSession.count",
      "browser.tabs.splitview.hasUsed",
      "browser.uiCustomization.",
      "browser.uidensity",
      "screenshots.browser.component.last-saved-method",
      "sidebar.backupState",
      "sidebar.history.sortOption"
    ];
    for (var i = 0; i < _all.length; i++) {
      var _n = _all[i];
      var _s = false;
      for (var j = 0; j < _skip.length; j++) {
        if (_n.indexOf(_skip[j]) === 0) { _s = true; break; }
      }
      if (_s) continue;
      var _t = _pb.getPrefType(_n);
      var _v = "";
      try {
        if (_t === 32) _v = _pb.getCharPref(_n);
        else if (_t === 64) _v = _pb.getIntPref(_n);
        else if (_t === 128) _v = _pb.getBoolPref(_n);
      } catch(e) { _v = "?"; }
      var _l = _pb.prefIsLocked(_n) ? " [LOCKED]" : "";
      // one record per line: a char pref may legally contain a newline
      _v = ("" + _v).replace(/\r/g, "\\r").replace(/\n/g, "\\n");
      _out.push((_n + " = " + _v + _l).replace(/[ \t]+$/, ""));
    }
    _out.sort();
    var _profDir = Services.dirsvc.get("ProfD", Components.interfaces.nsIFile);
    _profDir.append("generated_pref_dump.txt");
    _hifoxWriteAtomic(_profDir, _out.join("\n"));
    var _oldError = Services.dirsvc.get("ProfD", Components.interfaces.nsIFile);
    _oldError.append("generated_pref_dump.err");
    if (_oldError.exists()) _oldError.remove(false);
    Services.prefs.setStringPref("_hifox.pref_dump", _out.length + " prefs");
  } catch(e) {
    // write error to sibling .err file (verify.sh reads it)
    try {
      var _ef = Services.dirsvc.get("ProfD", Components.interfaces.nsIFile);
      _ef.append("generated_pref_dump.err");
      _hifoxWriteAtomic(_ef, "" + e);
    } catch(_) {}
  }
}

var _hifoxDumped = false;
function _hifoxDumpOnce() {
  if (_hifoxDumped) return;
  // first-launch on a fresh profile: user.js is deployed by the watcher AFTER Firefox
  // already loaded its prefs, so the canary is not in the runtime tree. dumping now
  // would persist a partial snapshot. skip; the next launch sees user.js and dumps clean.
  if (Services.prefs.getStringPref("_user_js.canary", "") !== "hifox") return;
  _hifoxDumped = true;
  _hifoxDoDump();
}

try {
  // delayed-startup-finished may run our observer BEFORE the ui_seeded one,
  // so defer the dump by a short timer to let other observers settle.
  var _hifoxStartupObs = {
    observe: function(subject) {
      if (!subject || subject.location?.href !== "chrome://browser/content/browser.xhtml") return;
      Services.obs.removeObserver(_hifoxStartupObs, "browser-delayed-startup-finished");
      var _t = Components.classes["@mozilla.org/timer;1"]
                 .createInstance(Components.interfaces.nsITimer);
      _t.initWithCallback({ notify: function() { _hifoxDumpOnce(); } },
                          800, Components.interfaces.nsITimer.TYPE_ONE_SHOT);
    }
  };
  Services.obs.addObserver(_hifoxStartupObs, "browser-delayed-startup-finished");
  // fallback: headless or no-window sessions never fire delayed-startup-finished;
  // catch the dump on shutdown so the file always reflects final pref state.
  var _hifoxQuitObs = {
    observe: function() {
      Services.obs.removeObserver(_hifoxQuitObs, "quit-application-granted");
      _hifoxDumpOnce();
    }
  };
  Services.obs.addObserver(_hifoxQuitObs, "quit-application-granted");
} catch(e) {
  try { Services.prefs.setStringPref("_hifox.error.dump_setup", String(e)); } catch(_) {}
}
